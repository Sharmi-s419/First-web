<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="100%" height="100%">
  <defs>
    <!-- Paper texture & shadow filter -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <filter id="waxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <!-- Wax Seal Gradient -->
    <radialGradient id="waxGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e89868" />
      <stop offset="40%" stop-color="#c88151" />
      <stop offset="85%" stop-color="#8c2535" />
      <stop offset="100%" stop-color="#54121d" />
    </radialGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf5" />
      <stop offset="60%" stop-color="#faf4e6" />
      <stop offset="100%" stop-color="#f5ecda" />
    </linearGradient>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Cormorant+Garamond:ital,wght@1,500;1,600&amp;display=swap');
    .bg-paper { fill: url(#paperGrad); }
    .letter-text {
      font-family: 'Caveat', 'Cormorant Garamond', cursive, serif;
      font-size: 27px;
      font-weight: 600;
      fill: #2c221c;
      letter-spacing: 0.02em;
    }
    .letter-title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 32px;
      font-weight: 600;
      fill: #a6582a;
      letter-spacing: 0.05em;
    }
    .seal-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 10px;
      font-weight: 700;
      fill: #fffdf9;
      letter-spacing: 0.14em;
    }
    .accent-heart {
      fill: #b3394b;
    }
  </style>

  <!-- Dark container backing -->
  <rect width="800" height="1100" fill="#0d0c13" />

  <!-- Parchment paper sheet -->
  <rect x="50" y="40" width="700" height="1020" rx="16" class="bg-paper" filter="url(#letterShadow)" stroke="#e4d7c3" stroke-width="2" />

  <!-- Elegant inner border -->
  <rect x="68" y="58" width="664" height="984" rx="10" fill="none" stroke="#d9caba" stroke-width="1" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Heading & Subtitle -->
  <text x="95" y="96" font-family="'Cormorant Garamond', Georgia, serif" font-size="18px" font-weight="700" fill="#9a4023" letter-spacing="0.03em">The First Letter I Wrote for You 💌</text>
  <text x="95" y="120" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-size="15px" fill="#724c38">My first letter to you, filled with feelings I wanted you to know.</text>

  <!-- Header Title -->
  <text x="95" y="158" class="letter-title">En Anbe ❤️</text>

  <!-- Copper Wax Seal in top-right -->
  <g transform="translate(640, 116)">
    <circle cx="0" cy="0" r="42" fill="url(#waxGrad)" filter="url(#waxShadow)" stroke="#f7d5bc" stroke-width="1.8" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#faebd7" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.75" />
    <!-- Heart in center -->
    <path d="M0 6 s-11 -7 -11 -13 a6 6 0 0 1 11 -4 a6 6 0 0 1 11 4 c0 6 -11 13 -11 13 z" fill="#faebd7" opacity="0.95" />
    <text x="0" y="20" text-anchor="middle" class="seal-text">KD &amp; ROWDY</text>
  </g>

  <!-- Exact Tamil-English love letter text -->
  <text x="95" y="175" class="letter-text">Naan idha ungakitte proper-ah sonnena nu therila…</text>
  <text x="95" y="215" class="letter-text">aana, en life-la neenga irukkuradhu enakku</text>
  <text x="95" y="255" class="letter-text">romba pidicha oru vishayam aayiduchu. ❤️</text>

  <text x="95" y="325" class="letter-text">Namma pesina conversations, namma panra silly moments,</text>
  <text x="95" y="365" class="letter-text">chinna chinna sandaigal, namma sirippu, andha ordinary days</text>
  <text x="95" y="405" class="letter-text">ellathukkum naduvula… eppo nu theriyama</text>
  <text x="95" y="445" class="letter-text">neenga enakku romba special aayita.</text>

  <text x="95" y="515" class="letter-text">Enakku oru perfect love story venum nu illa.</text>
  <text x="95" y="555" class="letter-text">Enakku namma story dhaan venum❤️</text>

  <text x="95" y="625" class="letter-text">Messy days irukkattum, happy days irukkattum,</text>
  <text x="95" y="665" class="letter-text">namma fight pandra days sa irukattum ellamey venum.</text>
  <text x="95" y="705" class="letter-text">Unga kooda experience panna dhaan aasai.</text>

  <text x="95" y="775" class="letter-text">Ennaku namma pesurathula neenga pathi things sa</text>
  <text x="95" y="815" class="letter-text">full la solla matinga atha full la finish pandrathu</text>
  <text x="95" y="855" class="letter-text">ennaku romba pidikum</text>

  <text x="95" y="915" class="letter-text">Athu mattum illa unga life la full ahatha place sa</text>
  <text x="95" y="955" class="letter-text">na fill pannanum nu ninaikuren.</text>

  <text x="95" y="1010" class="letter-text" font-size="24px" fill="#7a361c">So, innaiku naan unnagala enna chose panna sollala… forever promise pannunga nu kooda kekkala.</text>
  <text x="95" y="1040" class="letter-text" font-size="24px" fill="#7a361c">Naan just oru vishayam dhaan kekkuren…</text>
  <text x="95" y="1070" class="letter-text" font-size="25px" font-weight="700" fill="#a62c3f">Neenga enna choose pannuvingala ❤️ Innaikku mattum illa</text>
</svg>
